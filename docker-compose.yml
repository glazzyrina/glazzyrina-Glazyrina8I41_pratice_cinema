version: '3.8'

services:
  # Настройка контейнера Бэкенда
  backend:
    build: .
    ports:
      - "8080:8080"
    environment:
      - DATABASE_URL=postgresql://postgres:postgres@db:5432/cinema_db
    depends_on:
      - db

  # Настройка контейнера Фронтенда
  frontend:
    build: ./cinema_frontend
    ports:
      - "3000:3000"
    depends_on:
      - backend

  # Настройка контейнера Базы Данных PostgreSQL
  db:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: cinema_db
    ports:
      - "5432:5432"
